[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kilter-climb-predictor"
version = "0.1.0"
description = "ML-powered climbing route generator for the Kilter Board"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "boardlib>=0.1.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "torch>=2.0",
    "typer>=0.9",
    "rich>=13.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
kilter-gen = "src.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
